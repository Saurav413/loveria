<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Photo - Loveria</title>
    <link rel="stylesheet" href="../auth/Auth.css">
    <script src="../../utils/config.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-light: #ff758f;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--primary);
        }

        .subtitle {
            color: #555;
            margin-bottom: 18px;
        }

        .picker {
            margin: 14px 0;
            text-align: left;
        }

        .picker input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fff;
            color: #000;
        }

        .preview {
            margin: 14px 0;
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #eee;
            display: none;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-secondary {
            background: #f2f2f2;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add Your Couple Photo</h1>
        <p class="subtitle">Upload one special photo of both of you.</p>

        <div class="picker">
            <input type="file" id="couplePhoto" accept="image/*">
        </div>

        <img id="preview" class="preview" alt="Couple photo preview">

        <div class="btn-row">
            <button class="btn btn-primary" id="saveBtn" type="button">Save Photo</button>
            <button class="btn btn-secondary" id="skipBtn" type="button">Skip for now</button>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user.id) {
            window.location.href = '../auth/Login.html';
        }

        const fileInput = document.getElementById('couplePhoto');
        const preview = document.getElementById('preview');
        let selectedImageData = '';

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                selectedImageData = reader.result;
                preview.src = selectedImageData;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!selectedImageData) {
                alert('Please select a photo first.');
                return;
            }

            const response = await fetch(`${CONFIG.API_BASE_URL}/api/couple-photo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: user.id,
                    imageData: selectedImageData
                })
            });

            const data = await response.json();
            if (!response.ok) {
                alert(data.error || 'Failed to save photo.');
                return;
            }

            alert('Photo saved successfully!');
            window.location.href = '../../index.html';
        });

        document.getElementById('skipBtn').addEventListener('click', () => {
            window.location.href = '../../index.html';
        });
    </script>
</body>

</html>
