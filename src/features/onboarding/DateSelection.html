<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Date - Loveria</title>
    <link rel="stylesheet" href="../auth/Auth.css">
    <script src="../../utils/config.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-light: #ff758f;
            --bg: #fff0f3;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .onboarding-container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #edeff2;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: white;
            color: #333;
            font-family: inherit;
        }

        input[type="date"]:focus {
            border-color: var(--primary-light);
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.1);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .save-btn:hover {
            background: #ff758f;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 77, 109, 0.3);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .heart-container {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: inline-block;
            position: relative;
        }

        .main-heart {
            animation: pulse 2s infinite;
            display: inline-block;
        }

        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="onboarding-container">
        <div class="heart-container">
            <span class="main-heart">📅</span>
        </div>
        <h1>Our Journey</h1>
        <p class="subtitle">When did your beautiful story begin? <br> We'll help you celebrate every milestone.</p>

        <form id="date-form">
            <div class="input-group">
                <label for="relationshipDate">Together Since</label>
                <input type="date" id="relationshipDate" required>
            </div>
            <button type="submit" class="save-btn">
                Complete Setup ✨
            </button>
            <a href="./Nickname.html" class="back-link">← Change Nicknames</a>
        </form>
    </div>

    <script>
        // Set max date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('relationshipDate').setAttribute('max', today);

        document.getElementById('date-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const relationshipDate = document.getElementById('relationshipDate').value;
            const user = JSON.parse(localStorage.getItem('user'));

            if (!user || !user.id) {
                alert('User session not found. Please log in again.');
                window.location.href = '../auth/Login.html';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/user/relationship-date`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        relationshipDate
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user || {
                        ...user,
                        relationship_date: relationshipDate
                    }));
                    alert('Engagement successful! Set your first reminder.');
                    window.location.href = '../reminders/ReminderSetup.html';
                } else {
                    alert(data.error || 'Failed to update relationship date.');
                }
            } catch (err) {
                console.error(err);
                alert('Server connection failed.');
            }
        });
    </script>
</body>

</html>
