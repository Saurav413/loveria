<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loveria</title>
    <link rel="stylesheet" href="Auth.css">
    <script src="../../utils/config.js"></script>
</head>

<body>
    <div class="signup-container">
        <h1 onclick="window.location.href='Signup.html'" style="cursor:pointer">Loveria</h1>
        <p class="subtitle">Welcome back, connect now</p>

        <form>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="signup-btn">Log In</button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-btns">
            <button class="social-btn google">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google"
                    style="width: 18px;">
                Continue with Google
            </button>
            <button class="social-btn apple">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M15.5 12.5C14.7 13.9 13.7 15.3 12.3 15.3C11 15.3 10.6 14.5 9 14.5C7.4 14.5 7 15.3 5.7 15.3C4.4 15.3 3.3 13.8 2.5 12.5C0.9 9.9 0.3 7 1.2 5C1.8 3.5 3.3 2.5 4.9 2.5C5.8 2.5 6.7 3.1 7.2 3.1C7.8 3.1 8.8 2.3 10 2.3C11.3 2.3 12.4 2.8 13.1 3.5C11.5 4.8 11.8 7.3 13.4 8C14.1 8.4 14.8 8.6 15.4 8.7C15.2 9.5 14.9 10.3 14.5 11C14.8 11.5 15.2 12 15.5 12.5ZM10.4 2.1C11.7 0.5 10 0 10 0C10 0 9.2 0.7 8.1 2.1C7.5 2.7 8 2.5 8 2.5C8 2.5 9.1 3.7 10.4 2.1Z" />
                </svg>
                Continue with Apple
            </button>
        </div>

        <p class="footer-text">
            Don't have an account? <a href="Signup.html">Sign up</a><br><br>
            By logging in, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a>
        </p>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (!data.user.nickname || !data.user.partner_nickname) {
                        alert('Log in successful! Let\'s set your nicknames.');
                        window.location.href = '../onboarding/Nickname.html';
                    } else {
                        alert('Login successful! Redirecting...');
                        window.location.href = '../../index.html';
                    }
                } else {
                    alert(data.error || 'Login failed.');
                }
            } catch (err) {
                alert('Server connection failed.');
            }
        });
    </script>
</body>

</html>
