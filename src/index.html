<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loveria - Our Story</title>
    <link rel="stylesheet" href="features/auth/Auth.css">
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-light: #ff758f;
            --bg: #fff0f3;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .dashboard-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        .nicknames {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .counter-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(255, 77, 109, 0.1);
            margin-bottom: 30px;
        }

        .days-number {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 5px;
        }

        .days-label {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            color: #888;
            font-weight: 600;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: white;
            transform: translateY(-3px);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .logout-btn {
            margin-top: 30px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .logout-btn:hover {
            color: var(--primary);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 1.5rem;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div id="loading">✨ Creating Magic...</div>

    <div class="dashboard-container">
        <div class="heart-icon">💖</div>
        <h1 id="welcome-msg">Our Journey</h1>
        <div class="nicknames" id="nicknames-display">Loading...</div>

        <div class="counter-card">
            <div class="days-number" id="days-count">0</div>
            <div class="days-label">Days of Love</div>
        </div>

        <div class="menu-grid">
            <a href="features/countdown/index.html" class="menu-item">
                <span>⏳</span><br>Countdown
            </a>
            <a href="features/memories/index.html" class="menu-item">
                <span>📸</span><br>Memories
            </a>
            <a href="features/chat/index.html" class="menu-item">
                <span>💬</span><br>Secret Chat
            </a>
            <a href="features/timezone/index.html" class="menu-item">
                <span>🌎</span><br>Timezone
            </a>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));

            // 1. Check Authentication
            if (!user || !user.id) {
                window.location.href = 'features/auth/Login.html';
                return;
            }

            // 2. Check Onboarding Status
            if (!user.nickname || !user.partner_nickname) {
                window.location.href = 'features/onboarding/Nickname.html';
                return;
            }

            if (!user.relationship_date) {
                window.location.href = 'features/onboarding/DateSelection.html';
                return;
            }

            // 3. Display Data
            document.getElementById('loading').style.display = 'none';
            document.getElementById('nicknames-display').innerText = `${user.nickname} & ${user.partner_nickname}`;

            // 4. Calculate Days
            const calcDays = () => {
                const startDate = new Date(user.relationship_date);
                const today = new Date();
                const diffTime = Math.abs(today - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('days-count').innerText = diffDays;
            };

            calcDays();
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'features/auth/Login.html';
        }
    </script>
</body>

</html>
