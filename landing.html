<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loveria</title>
  <style>
    :root {
      --primary: #ff5cc8;
      --primary-light: #ff90dd;
      --muted: #c9a8e8;
      --line: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 0%, #5a2bb5 0%, #2a0f62 42%, #13042f 100%);
      color: #fde9ff;
      font-family: Georgia, "Times New Roman", serif;
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 4vw;
      border-bottom: 1px solid var(--line);
      background: rgba(19, 4, 47, 0.45);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    .header-link {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--muted);
    }

    .header-link:hover { color: #fff; }

    .hero {
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 4.5rem 0 3rem;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 3rem;
      align-items: center;
    }

    .hero h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1.05;
      color: var(--primary);
    }

    .hero p {
      margin: 0 0 1.75rem;
      max-width: 28rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .auth-panel {
      background: rgba(39, 14, 76, 0.55);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(10px);
    }

    .auth-panel h2 {
      margin: 0 0 1rem;
      font-size: 1.4rem;
      color: #fff;
    }

    .social-btns {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .social-btn.google { background: #000; color: #fff; }
    .social-btn.apple { background: #000; color: #fff; }
    .social-btn.login {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .google-logo-badge { width: 18px; height: 18px; display: inline-flex; }
    .google-logo-badge svg { width: 100%; height: 100%; }

    .footer-text {
      margin: 1.1rem 0 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
    }

    .footer-text a { color: var(--primary-light); }

    .site-footer {
      width: min(1100px, 92vw);
      margin: 2rem auto 0;
      padding: 1.25rem 0 2rem;
      border-top: 1px solid var(--line);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 800px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="landing.html">Loveria</a>
    <a class="header-link" href="src/features/auth/Login.html">Log in</a>
  </header>

  <section class="hero">
    <div>
      <h1>Connect with your favorite person</h1>
      <p>A shared space for your journey, reminders, drawings, and memories — made for two.</p>
    </div>

    <aside class="auth-panel">
      <h2>Get started</h2>
      <div class="social-btns">
        <a class="social-btn google" href="src/features/auth/Signup.html">
          <span class="google-logo-badge" aria-hidden="true">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.2l6.6-6.6C35.4 2.4 30.1 0 24 0 14.6 0 6.4 5.4 2.4 13.3l7.7 6c1.8-5.6 7.1-9.8 13.9-9.8z"/>
              <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.8c-.3 2-1.8 5.1-5.1 7.2l7.6 5.9c4.4-4.1 7.2-10.2 7.2-16.8z"/>
              <path fill="#FBBC05" d="M10.1 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.7-6C.9 16.5 0 20.1 0 24c0 3.9.9 7.5 2.4 10.7l7.7-6z"/>
              <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.6-5.9c-2 1.4-4.8 2.4-8.4 2.4-6.8 0-12.1-4.2-13.9-9.8l-7.7 6C6.4 42.6 14.6 48 24 48z"/>
            </svg>
          </span>
          Continue with Google
        </a>
        <a class="social-btn apple" href="src/features/auth/Signup.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zm3.378-3.066c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702z"/>
          </svg>
          Continue with Apple
        </a>
        <a class="social-btn login" href="src/features/auth/Login.html">Log in</a>
      </div>
      <p class="footer-text">
        New here? <a href="src/features/auth/Signup.html">Sign up</a><br />
        By continuing, you agree to our Terms &amp; Privacy Policy
      </p>
    </aside>
  </section>

  <footer class="site-footer">Loveria</footer>
</body>
</html>
