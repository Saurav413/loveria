<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture - Loveria</title>
    <link rel="stylesheet" href="../auth/Auth.css">
    <script src="../../utils/config.js"></script>
    <style>
        :root {
            --primary: #ff5cc8;
            --primary-light: #b46bff;
            --glass: rgba(32, 15, 58, 0.72);
        }

        body {
            background:
                radial-gradient(circle at 12% 16%, rgba(255, 92, 200, 0.28) 0%, transparent 44%),
                radial-gradient(circle at 85% 82%, rgba(121, 76, 255, 0.24) 0%, transparent 42%),
                linear-gradient(145deg, #12031f 0%, #1b0834 55%, #271146 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--glass);
            border: 1px solid rgba(255, 170, 236, 0.28);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 16px 38px rgba(8, 3, 20, 0.48);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            color: #ffd7f7;
        }

        .subtitle {
            color: #d9c7f3;
            margin-bottom: 18px;
        }

        .picker {
            margin: 14px 0;
            text-align: left;
        }

        .picker input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid rgba(255, 170, 236, 0.32);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .preview {
            margin: 14px auto;
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255, 170, 236, 0.42);
            display: none;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff5cc8 0%, #8f5bff 100%);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.16);
            color: #f2e6ff;
        }

        .back-link {
            display: inline-block;
            margin-top: 14px;
            color: #d9c7f3;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add Your Profile Picture</h1>
        <p class="subtitle">Upload a photo to personalize your Loveria profile.</p>

        <div class="picker">
            <input type="file" id="profilePhoto" accept="image/*">
        </div>

        <img id="preview" class="preview" alt="Profile picture preview">

        <div class="btn-row">
            <button class="btn btn-primary" id="saveBtn" type="button">Save & Continue</button>
            <button class="btn btn-secondary" id="skipBtn" type="button">Skip</button>
        </div>

        <a href="./DateSelection.html" class="back-link">← Back to date selection</a>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user.id) {
            window.location.href = '../auth/Login.html';
        }

        const fileInput = document.getElementById('profilePhoto');
        const preview = document.getElementById('preview');
        let selectedImageData = '';

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                selectedImageData = reader.result;
                preview.src = selectedImageData;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!selectedImageData) {
                alert('Please select a profile picture first, or tap Skip.');
                return;
            }

            const response = await fetch(`${CONFIG.API_BASE_URL}/api/user/profile-picture`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: user.id,
                    imageData: selectedImageData
                })
            });

            const data = await response.json();
            if (!response.ok) {
                alert(data.error || 'Failed to save profile picture.');
                return;
            }

            alert('Profile picture saved!');
            window.location.href = './Pairing.html';
        });

        document.getElementById('skipBtn').addEventListener('click', () => {
            window.location.href = './Pairing.html';
        });
    </script>
</body>

</html>
