<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loveria - Our Story</title>
    <link rel="stylesheet" href="features/auth/Auth.css">
    <style>
        :root {
            --primary: #ff5cc8;
            --primary-light: #ff90dd;
            --bg: #1b083c;
            --glass: rgba(39, 14, 76, 0.78);
        }

        body {
            background: radial-gradient(circle at 14% 10%, #6e37eb 0%, #2a0f62 46%, #13042f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            color: #fde9ff;
        }

        .dashboard-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(8, 3, 20, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        .nicknames {
            font-size: 1.2rem;
            color: #e9d0ff;
            margin-bottom: 30px;
            font-style: italic;
        }

        .counter-card {
            background: linear-gradient(135deg, rgba(35, 14, 67, 0.92) 0%, rgba(53, 24, 96, 0.92) 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 12px 26px rgba(8, 3, 20, 0.4);
            border: 1px solid rgba(255, 175, 236, 0.34);
            margin-bottom: 30px;
        }

        .slideshow-card {
            background: linear-gradient(135deg, rgba(255, 98, 204, 0.3) 0%, rgba(130, 93, 255, 0.28) 100%);
            border-radius: 20px;
            box-shadow: 0 14px 30px rgba(8, 3, 20, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 176, 237, 0.42);
            padding: 8px;
            backdrop-filter: blur(8px);
        }

        .slideshow-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            max-height: 320px;
            box-sizing: border-box;
            padding: 8px;
            border-radius: 14px;
            object-fit: contain;
            display: none;
            background: linear-gradient(135deg, #2a0f62 0%, #13042f 100%);
            border: 2px solid rgba(255, 255, 255, 0.92);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .slideshow-image.fading {
            opacity: 0.15;
        }

        .slideshow-placeholder {
            padding: 22px;
            color: #f2d8ff;
            font-size: 0.95rem;
        }

        .slideshow-caption {
            padding: 10px 14px 14px;
            color: #f1d6ff;
            font-size: 0.9rem;
            text-align: left;
            min-height: 18px;
        }

        .days-number {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ff78d4;
            text-shadow: 0 0 20px rgba(255, 120, 212, 0.28);
            line-height: 1;
            margin-bottom: 5px;
        }

        .days-label {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            color: #f2deff;
            font-weight: 600;
        }

        .distance-card {
            background: linear-gradient(135deg, rgba(35, 14, 67, 0.92) 0%, rgba(53, 24, 96, 0.92) 100%);
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 12px 26px rgba(8, 3, 20, 0.4);
            border: 1px solid rgba(255, 175, 236, 0.34);
            margin-bottom: 24px;
            text-align: left;
        }

        .distance-title {
            color: #b987ff;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .distance-main {
            color: #f7e8ff;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .distance-line {
            color: #dcc0ff;
            font-size: 0.88rem;
            margin: 4px 0;
            word-break: break-word;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.12);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #f7e8ff;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .logout-btn {
            margin-top: 30px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .logout-btn:hover {
            color: var(--primary);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 1.5rem;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div id="loading">✨ Creating Magic...</div>

    <div class="dashboard-container">
        <div class="heart-icon">💖</div>
        <h1 id="welcome-msg">Our Journey</h1>
        <div class="nicknames" id="nicknames-display">Loading...</div>

        <div class="counter-card">
            <div class="days-number" id="days-count">0</div>
            <div class="days-label">Days of Love</div>
        </div>

        <div class="distance-card">
            <div class="distance-title">Our Distance</div>
            <div id="distanceMain" class="distance-main">Detecting locations...</div>
            <div id="selfLocationLine" class="distance-line">Your location: --</div>
            <div id="partnerLocationLine" class="distance-line">Partner location: --</div>
        </div>

        <div class="slideshow-card">
            <img id="sharedSlideshowImage" class="slideshow-image" alt="Shared memory slideshow">
            <div id="slideshowPlaceholder" class="slideshow-placeholder">
                No shared slideshow photos yet. Add photos from Shared Slideshow.
            </div>
            <div id="slideshowCaption" class="slideshow-caption"></div>
        </div>

        <div class="menu-grid">
            <a href="features/countdown/index.html" class="menu-item">
                <span>⏳</span><br>Countdown
            </a>
            <a href="features/memories/index.html" class="menu-item">
                <span>📸</span><br>Memories
            </a>
            <a href="features/chat/index.html" class="menu-item">
                <span>💬</span><br>Secret Chat
            </a>
            <a href="features/timezone/index.html" class="menu-item">
                <span>🌎</span><br>Timezone
            </a>
            <a href="features/reminders/ReminderSetup.html" class="menu-item">
                <span>🗓️</span><br>Reminders
            </a>
            <a href="features/drawing/SharedDrawing.html" class="menu-item">
                <span>✍️</span><br>Live Drawing
            </a>
            <a href="features/memories/SharedSlideshow.html" class="menu-item">
                <span>🖼️</span><br>Shared Slideshow
            </a>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script src="utils/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user'));

            // 1. Check Authentication
            if (!user || !user.id) {
                window.location.href = 'features/auth/Login.html';
                return;
            }

            // 2. Refresh user from DB so UI always reflects saved data.
            let dbUser = user;
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/user/${user.id}`);
                const data = await response.json();
                if (response.ok && data.user) {
                    dbUser = data.user;
                    localStorage.setItem('user', JSON.stringify(dbUser));
                }
            } catch (err) {
                // Fall back to local storage when offline/API unavailable.
                console.warn('Could not refresh user from DB:', err);
            }

            // 3. Check onboarding status
            if (!dbUser.gender) {
                window.location.href = 'features/onboarding/GenderSelection.html';
                return;
            }

            if (!dbUser.nickname || !dbUser.partner_nickname) {
                window.location.href = 'features/onboarding/Nickname.html';
                return;
            }

            if (!dbUser.relationship_date) {
                window.location.href = 'features/onboarding/DateSelection.html';
                return;
            }

            if (!dbUser.partner_user_id) {
                window.location.href = 'features/onboarding/Pairing.html';
                return;
            }

            // 4. Display Data
            document.getElementById('loading').style.display = 'none';
            document.getElementById('nicknames-display').innerText = `${dbUser.nickname} & ${dbUser.partner_nickname}`;

            // 5. Calculate Days
            const calcDays = () => {
                const startDate = new Date(dbUser.relationship_date);
                const today = new Date();
                const diffTime = Math.abs(today - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('days-count').innerText = diffDays;
            };

            calcDays();

            const slideshowImage = document.getElementById('sharedSlideshowImage');
            const slideshowPlaceholder = document.getElementById('slideshowPlaceholder');
            const slideshowCaption = document.getElementById('slideshowCaption');
            const SLIDESHOW_INTERVAL_MS = 3000;
            let slideshowPhotos = [];
            let slideshowIndex = 0;
            let isAnimating = false;
            let slideshowRefreshTimer = null;
            let slideshowTickTimer = null;
            let serverTimeOffsetMs = 0;
            let locationRefreshTimer = null;

            const renderSlideshow = () => {
                if (!slideshowPhotos.length) {
                    slideshowImage.style.display = 'none';
                    slideshowPlaceholder.style.display = 'block';
                    slideshowCaption.textContent = '';
                    return;
                }
                slideshowPlaceholder.style.display = 'none';
                slideshowImage.style.display = 'block';
                slideshowCaption.textContent = slideshowPhotos[slideshowIndex].caption || '';

                if (!slideshowImage.src) {
                    slideshowImage.src = slideshowPhotos[slideshowIndex].image_data;
                    return;
                }

                if (isAnimating) return;
                isAnimating = true;
                slideshowImage.classList.add('fading');
                setTimeout(() => {
                    slideshowImage.src = slideshowPhotos[slideshowIndex].image_data;
                    slideshowImage.classList.remove('fading');
                    isAnimating = false;
                }, 280);
            };

            const getServerNowMs = () => Date.now() + serverTimeOffsetMs;

            const getSynchronizedIndex = () => {
                if (!slideshowPhotos.length) return 0;
                const anchorMs = Date.parse(slideshowPhotos[0].created_at) || 0;
                const elapsedMs = Math.max(getServerNowMs() - anchorMs, 0);
                return Math.floor(elapsedMs / SLIDESHOW_INTERVAL_MS) % slideshowPhotos.length;
            };

            const startSynchronizedTicker = () => {
                if (slideshowTickTimer) clearInterval(slideshowTickTimer);
                slideshowTickTimer = setInterval(() => {
                    if (!slideshowPhotos.length) return;
                    const nextIndex = getSynchronizedIndex();
                    if (nextIndex !== slideshowIndex) {
                        slideshowIndex = nextIndex;
                        renderSlideshow();
                    }
                }, 500);
            };

            const refreshSlideshow = async () => {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/slideshow/${dbUser.id}`);
                const data = await response.json();
                const serverDateHeader = response.headers.get('date');
                if (serverDateHeader) {
                    const serverNow = Date.parse(serverDateHeader);
                    if (!Number.isNaN(serverNow)) {
                        serverTimeOffsetMs = serverNow - Date.now();
                    }
                }

                if (response.ok && Array.isArray(data.photos)) {
                    slideshowPhotos = [...data.photos].sort((a, b) => {
                        const timeA = Date.parse(a.created_at) || 0;
                        const timeB = Date.parse(b.created_at) || 0;
                        if (timeA !== timeB) return timeA - timeB;
                        return Number(a.id) - Number(b.id);
                    });
                    if (!slideshowPhotos.length) {
                        slideshowIndex = 0;
                    } else {
                        slideshowIndex = getSynchronizedIndex();
                    }
                    renderSlideshow();
                    startSynchronizedTicker();
                } else {
                    slideshowPhotos = [];
                    slideshowIndex = 0;
                    renderSlideshow();
                }
            };

            const distanceMain = document.getElementById('distanceMain');
            const selfLocationLine = document.getElementById('selfLocationLine');
            const partnerLocationLine = document.getElementById('partnerLocationLine');

            const formatCoord = (lat, lng) => {
                if (lat == null || lng == null) return 'Not shared yet';
                return `${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;
            };

            const updateLocationOnServer = async (latitude, longitude) => {
                await fetch(`${CONFIG.API_BASE_URL}/api/location/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: dbUser.id,
                        latitude,
                        longitude
                    })
                });
            };

            const refreshDistanceCard = async () => {
                try {
                    const response = await fetch(`${CONFIG.API_BASE_URL}/api/location/${dbUser.id}`);
                    const data = await response.json();
                    if (!response.ok) {
                        distanceMain.textContent = data.error || 'Could not load distance.';
                        return;
                    }

                    const selfName = data.self?.nickname || 'You';
                    const partnerName = data.partner?.nickname || 'Partner';

                    selfLocationLine.textContent = `${selfName}: ${formatCoord(data.self?.latitude, data.self?.longitude)}`;
                    partnerLocationLine.textContent = `${partnerName}: ${formatCoord(data.partner?.latitude, data.partner?.longitude)}`;

                    if (data.distance_km == null) {
                        distanceMain.textContent = 'Waiting for both locations...';
                    } else {
                        distanceMain.textContent = `${Number(data.distance_km).toFixed(2)} km apart`;
                    }
                } catch (err) {
                    distanceMain.textContent = 'Could not load distance.';
                }
            };

            const captureAndSyncLocation = async () => {
                if (!navigator.geolocation) {
                    distanceMain.textContent = 'Geolocation is not supported on this device.';
                    return;
                }

                const getPosition = () => new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 60000
                    });
                });

                try {
                    const position = await getPosition();
                    await updateLocationOnServer(position.coords.latitude, position.coords.longitude);
                } catch (err) {
                    if (err && err.code === 1) {
                        distanceMain.textContent = 'Location permission denied.';
                    } else {
                        distanceMain.textContent = 'Could not get current location.';
                    }
                }

                await refreshDistanceCard();
            };

            try {
                await refreshSlideshow();
                if (slideshowRefreshTimer) {
                    clearInterval(slideshowRefreshTimer);
                }
                slideshowRefreshTimer = setInterval(refreshSlideshow, 5000);
            } catch (err) {
                renderSlideshow();
            }

            await captureAndSyncLocation();
            if (locationRefreshTimer) clearInterval(locationRefreshTimer);
            locationRefreshTimer = setInterval(captureAndSyncLocation, 60000);
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'features/auth/Login.html';
        }
    </script>
</body>

</html>
